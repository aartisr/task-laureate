<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <!-- Purple glow gradient -->
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <!-- Blue accent gradient -->
    <radialGradient id="glow2" cx="80%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Pink accent -->
    <radialGradient id="glow3" cx="60%" cy="90%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <!-- Brand gradient for text -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <!-- Progress bar gradient -->
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Subtle border filter -->
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left side: Brand block -->
  <g transform="translate(80, 80)">

    <!-- Badge pill -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="90" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" letter-spacing="0.5">Task Laureate</text>

    <!-- Main title -->
    <text y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="url(#brand)" letter-spacing="-1">Task-Laureate</text>

    <!-- Tagline -->
    <text y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="400" fill="#b3b3b3" letter-spacing="-0.3">Calm. Fast. Premium.</text>

    <!-- Description -->
    <text y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#808080">
      <tspan>Task orchestration for high-performance teams.</tspan>
    </text>
    <text y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#808080">
      <tspan>Open source. Free forever.</tspan>
    </text>

    <!-- Feature pills row -->
    <g transform="translate(0, 265)">
      <!-- Lists pill -->
      <rect x="0" y="0" width="116" height="36" rx="18" fill="#262626" stroke="#374151" stroke-width="1"/>
      <text x="58" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#d1d5db">📋 Lists</text>

      <!-- Tasks pill -->
      <rect x="128" y="0" width="118" height="36" rx="18" fill="#262626" stroke="#374151" stroke-width="1"/>
      <text x="187" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#d1d5db">✓ Tasks</text>

      <!-- Progress pill -->
      <rect x="258" y="0" width="136" height="36" rx="18" fill="#262626" stroke="#374151" stroke-width="1"/>
      <text x="326" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#d1d5db">📈 Progress</text>

      <!-- Analytics pill -->
      <rect x="406" y="0" width="140" height="36" rx="18" fill="#262626" stroke="#374151" stroke-width="1"/>
      <text x="476" y="23" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#d1d5db">🎉 Analytics</text>
    </g>

    <!-- Built by attribution -->
    <g transform="translate(0, 365)">
      <text font-family="-apple-system, sans-serif" font-size="15" fill="#595959">Built by </text>
      <text x="56" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#8b5cf6">Aarti S Ravikumar</text>
      <text x="220" font-family="-apple-system, sans-serif" font-size="15" fill="#595959"> · </text>
      <text x="232" font-family="-apple-system, sans-serif" font-size="15" fill="#595959">PCSSII</text>
    </g>
  </g>

  <!-- Right side: App preview cards -->
  <g transform="translate(700, 60)">

    <!-- Stat card 1: Lists -->
    <rect x="0" y="0" width="200" height="110" rx="12" fill="url(#card)" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="110" rx="12" fill="#8b5cf6" fill-opacity="0.04"/>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#808080" letter-spacing="1" text-transform="uppercase">LISTS</text>
    <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#808080" letter-spacing="1">LISTS</text>
    <text x="20" y="75" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#f5f5f5">12</text>
    <text x="20" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#595959">View all lists →</text>
    <text x="168" y="40" font-family="-apple-system, sans-serif" font-size="24">📋</text>

    <!-- Stat card 2: Tasks -->
    <rect x="220" y="0" width="200" height="110" rx="12" fill="url(#card)" stroke="#374151" stroke-width="1"/>
    <rect x="220" y="0" width="200" height="110" rx="12" fill="#3b82f6" fill-opacity="0.04"/>
    <text x="240" y="34" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#808080" letter-spacing="1">TASKS</text>
    <text x="240" y="75" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#f5f5f5">48</text>
    <text x="240" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#595959">View all tasks →</text>
    <text x="388" y="40" font-family="-apple-system, sans-serif" font-size="24">✓</text>

    <!-- Stat card 3: Completed -->
    <rect x="0" y="130" width="200" height="110" rx="12" fill="url(#card)" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="130" width="200" height="110" rx="12" fill="#10b981" fill-opacity="0.04"/>
    <text x="20" y="164" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#808080" letter-spacing="1">COMPLETED</text>
    <text x="20" y="205" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#34d399">31</text>
    <text x="20" y="228" font-family="-apple-system, sans-serif" font-size="11" fill="#595959">See your wins →</text>
    <text x="168" y="170" font-family="-apple-system, sans-serif" font-size="24">🎉</text>

    <!-- Stat card 4: Progress -->
    <rect x="220" y="130" width="200" height="110" rx="12" fill="url(#card)" stroke="#374151" stroke-width="1"/>
    <rect x="220" y="130" width="200" height="110" rx="12" fill="#8b5cf6" fill-opacity="0.06"/>
    <text x="240" y="164" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#808080" letter-spacing="1">PROGRESS</text>
    <text x="240" y="205" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#a78bfa">65%</text>
    <!-- Progress bar -->
    <rect x="240" y="218" width="160" height="6" rx="3" fill="#374151"/>
    <rect x="240" y="218" width="104" height="6" rx="3" fill="url(#bar)"/>
    <text x="388" y="170" font-family="-apple-system, sans-serif" font-size="24">📈</text>

    <!-- List preview card -->
    <rect x="0" y="265" width="420" height="130" rx="12" fill="url(#card)" stroke="#374151" stroke-width="1"/>
    <text x="20" y="295" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#595959" letter-spacing="1">CURRENT WORK</text>
    <text x="20" y="320" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f5f5f5">🚀 Product Launch</text>
    <!-- Progress bar -->
    <rect x="20" y="330" width="380" height="4" rx="2" fill="#374151"/>
    <rect x="20" y="330" width="253" height="4" rx="2" fill="url(#bar)"/>
    <text x="20" y="356" font-family="-apple-system, sans-serif" font-size="12" fill="#808080">4/6 tasks · 67% complete</text>
    <text x="20" y="378" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f5f5f5">⚙️ Operations</text>
    <!-- Progress bar 2 -->
    <rect x="20" y="387" width="380" height="4" rx="2" fill="#374151"/>
    <rect x="20" y="387" width="95" height="4" rx="2" fill="#34d399"/>

    <!-- Search preview -->
    <rect x="0" y="420" width="420" height="52" rx="12" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
    <text x="20" y="451" font-family="-apple-system, sans-serif" font-size="15" fill="#595959">🔍  Search lists, tasks, tags, notes...</text>
  </g>

  <!-- Bottom border gradient line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#bar)" opacity="0.6"/>

  <!-- URL tag bottom left -->
  <text x="80" y="606" font-family="-apple-system, sans-serif" font-size="14" fill="#595959">tasks.ai-aarti.com</text>
</svg>

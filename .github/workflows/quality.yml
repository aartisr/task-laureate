name: Production quality gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and validate deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run quality:gate
      # Date-only logic must remain correct for users outside the UTC CI host.
      - name: Verify PWA and date boundaries in America/New_York
        env:
          TZ: America/New_York
        run: npm run test:pwa-contract -w apps/web && npm run test -w apps/web -- src/core/domain/dateOnly.test.ts

  security:
    name: Production dependency security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run check:security

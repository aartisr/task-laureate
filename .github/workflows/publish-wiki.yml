name: Publish GitHub Wiki

on:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Sync versioned Wiki source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy Wiki pages to GitHub Wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_REPOSITORY: ${{ github.repository }}.wiki.git
        run: |
          wiki_directory="$(mktemp -d)"
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${WIKI_REPOSITORY}" "${wiki_directory}"
          cp wiki/*.md "${wiki_directory}/"
          cd "${wiki_directory}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --staged --quiet && exit 0
          git commit -m "docs: sync Task-Laureate Wiki"
          git push
